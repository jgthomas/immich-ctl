name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked python -m unittest discover -v

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked mypy

      - name: Check installed commands
        run: |
          uv run --locked immich-ping --help
          uv run --locked immich-describe-takeout --help
          uv run --locked immich-takeout --help
          uv run --locked immich-upload-folder --help
          uv run --locked immich-validate-folder --help
          uv run --locked immich-repair-filenames --help

  immich-go-integration:
    name: immich-go 0.32.0 integrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.3"
          python-version: "3.14"
          enable-cache: true
      - name: Install project and development dependencies
        run: uv sync --locked --dev
      - name: Install pinned immich-go
        shell: bash
        run: |
          download="$RUNNER_TEMP/immich-go-download"
          mkdir -p "$download" "$RUNNER_TEMP/immich-go-bin"
          cd "$download"
          base=https://github.com/simulot/immich-go/releases/download/v0.32.0
          curl --fail --location --retry 3 "$base/immich-go_Linux_x86_64.tar.gz" -o immich-go_Linux_x86_64.tar.gz
          curl --fail --location --retry 3 "$base/checksums.txt" -o checksums.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path

          name = "immich-go_Linux_x86_64.tar.gz"
          expected = dict(line.split()[::-1] for line in Path("checksums.txt").read_text().splitlines())[name]
          actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("immich-go release checksum mismatch")
          PY
          tar -xzf immich-go_Linux_x86_64.tar.gz -C "$RUNNER_TEMP/immich-go-bin" immich-go
          echo "$RUNNER_TEMP/immich-go-bin" >> "$GITHUB_PATH"
      - name: Require upstream binary and run integrations
        run: |
          immich-go version
          uv run --locked python -m unittest discover -v
