name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked python -m unittest discover -v

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked mypy

      - name: Check installed commands
        run: |
          uv run --locked immich-ping --help
          uv run --locked immich-describe-takeout --help
          uv run --locked immich-takeout --help
          uv run --locked immich-upload-folder --help
          uv run --locked immich-validate-folder --help

  mutation-report:
    name: Mutation report (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.3"
          python-version: "3.14"
          enable-cache: true

      - name: Install mutation-testing dependencies
        id: install
        run: uv sync --locked --group mutation

      - name: Run mutations
        id: mutations
        continue-on-error: true
        shell: bash
        # Leave time to collect partial results if the mutation run times out.
        run: timeout 10m uv run --locked --group mutation mutmut run --max-children 2 | tee mutation-run.log

      - name: Export mutation results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          uv run --locked --group mutation mutmut results > mutation-results.txt
          uv run --locked --group mutation mutmut export-cicd-stats

      - name: Summarise mutation results
        if: ${{ !cancelled() }}
        env:
          MUTATION_OUTCOME: ${{ steps.mutations.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as report:
              print("### Mutation report (informational)", file=report)
              print("\nScope: shared `immich_ctl/` helpers; CLI scripts are not mutated.", file=report)
              print(f"\nMutation run: **{os.environ['MUTATION_OUTCOME']}**.", file=report)
              print("Results do not block CI. Failed runs may have incomplete results.", file=report)
              stats = Path("mutants/mutmut-cicd-stats.json")
              if stats.exists():
                  print("\n| Result | Count |\n|---|---:|", file=report)
                  for name, value in json.loads(stats.read_text()).items():
                      print(f"| {name.replace('_', ' ')} | {value} |", file=report)
              else:
                  print("\nNo mutation statistics were produced; check the job logs.", file=report)
              print("\nDownload the `mutation-report` artifact for logs and mutation details.", file=report)
          PY

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: |
            mutation-run.log
            mutation-results.txt
            mutants/
          if-no-files-found: warn
          retention-days: 14
