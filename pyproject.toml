[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-ctl"
version = "0.1.0"
description = "Standalone utilities for managing a PixelUnion Immich library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "ruff==0.14.1",
]
mutation = [
    "mutmut>=3.8.0",
]

[tool.setuptools]
packages = ["immich_ctl"]
script-files = ["immich-ping", "immich-describe-takeout", "immich-takeout", "immich-upload-folder"]

[tool.uv]
# Setuptools copies script-files into .venv/bin; refresh them when sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "immich-ping" },
    { file = "immich-describe-takeout" },
    { file = "immich-takeout" },
    { file = "immich-upload-folder" },
    { file = "immich_ctl/**/*.py" },
    { file = "README.md" },
    { file = "MANIFEST.in" },
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Include the executable Python scripts, which deliberately have no .py suffix.
extend-include = ["immich-ping", "immich-describe-takeout", "immich-takeout", "immich-upload-folder"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["immich-ping", "immich-describe-takeout", "immich-takeout", "immich-upload-folder", "immich_ctl"]
# Give each extensionless script its own module name when checking them together.
scripts_are_modules = true
check_untyped_defs = true

[tool.mutmut]
# Start with shared parsing/validation; the extensionless CLI scripts are copied
# so the existing tests run, but are not themselves mutation targets.
source_paths = ["immich_ctl/"]
also_copy = ["immich-ping", "immich-describe-takeout", "immich-takeout", "immich-upload-folder"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
# Avoid collecting the test copies generated under mutants/ on normal runs.
testpaths = ["tests"]
